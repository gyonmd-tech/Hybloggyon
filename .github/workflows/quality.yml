name: Quality and CMS integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hybloggyon_test
          POSTGRES_USER: hybloggyon
          POSTGRES_PASSWORD: hybloggyon_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hybloggyon -d hybloggyon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://hybloggyon:hybloggyon_test_password@127.0.0.1:5432/hybloggyon_test
      DATABASE_SSL: disable
      DATABASE_POOL_MAX: 2
      CONTENT_SOURCE: database
      MEDIA_STORAGE: local
      MEDIA_MAX_SIZE_MB: 2
      ADMIN_EMAIL: owner@example.test
      ADMIN_DISPLAY_NAME: Integration Owner
      ADMIN_PASSWORD: correct-horse-battery-staple
      E2E_ADMIN_EMAIL: owner@example.test
      E2E_ADMIN_PASSWORD: correct-horse-battery-staple
      E2E_MUTATION_TESTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Prepare database and content
        run: |
          npm run db:migrate
          npm run db:seed
          npm run admin:create
          npm run content:import
          npm run db:check
          npm run content:audit

      - name: Validate source
        run: |
          npm run env:check -- --require-database
          npm run db:migrations:check
          npm run content:check
          npm run seo:check
          npm run lint

      - name: Build production application
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
